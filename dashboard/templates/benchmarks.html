{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-white mb-0">Performance Benchmarks</h2>
    <div>
        <form action="{{ url_for('run_benchmark') }}" method="POST" class="d-inline"
            onsubmit="return confirm('This will take some time. Continue?');">
            <button type="submit" class="btn btn-warning me-2">
                <i class="fas fa-tachometer-alt me-2"></i>Run Benchmarks
            </button>
        </form>
        <form action="{{ url_for('generate_graphs') }}" method="POST" class="d-inline">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-chart-pie me-2"></i>Generate Graphs
            </button>
        </form>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card glass-panel h-100">
            <div class="card-header bg-transparent border-bottom-0">
                <h5 class="card-title text-white">Throughput Comparison</h5>
            </div>
            <div class="card-body text-center">
                <img src="{{ url_for('get_graph', filename='throughput_comparison.png') }}" class="img-fluid rounded"
                    alt="Run benchmarks to see data"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/FFF?text=No+Data';">
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card glass-panel h-100">
            <div class="card-header bg-transparent border-bottom-0">
                <h5 class="card-title text-white">Latency Comparison</h5>
            </div>
            <div class="card-body text-center">
                <img src="{{ url_for('get_graph', filename='latency_comparison.png') }}" class="img-fluid rounded"
                    alt="Run benchmarks to see data"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/FFF?text=No+Data';">
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card glass-panel h-100">
            <div class="card-header bg-transparent border-bottom-0">
                <h5 class="card-title text-white">CPU Overhead</h5>
            </div>
            <div class="card-body text-center">
                <img src="{{ url_for('get_graph', filename='cpu_overhead.png') }}" class="img-fluid rounded"
                    alt="Run benchmarks to see data"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/FFF?text=No+Data';">
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card glass-panel h-100">
            <div class="card-header bg-transparent border-bottom-0">
                <h5 class="card-title text-white">Summary Table</h5>
            </div>
            <div class="card-body text-center">
                <img src="{{ url_for('get_graph', filename='summary_table.png') }}" class="img-fluid rounded"
                    alt="Run benchmarks to see data"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/FFF?text=No+Data';">
            </div>
        </div>
    </div>
</div>
{% endblock %}
