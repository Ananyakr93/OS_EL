{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-white mb-0">System Logs</h2>
    <a href="{{ url_for('logs') }}" class="btn btn-primary">
        <i class="fas fa-sync-alt me-2"></i>Refresh
    </a>
</div>

<div class="card glass-panel h-100">
    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
        <h5 class="text-white mb-0">encfs_perf.log</h5>
        <span class="badge bg-info text-dark">Last 100 lines</span>
    </div>
    <div class="card-body p-0">
        <pre class="m-0 p-3 text-white-50" style="max-height: 70vh; overflow-y: auto; font-size: 0.85rem;"
            id="logContent">{% for line in logs %}{{ line }}{% else %}No logs found.{% endfor %}</pre>
    </div>
</div>

<script>
    // Auto scroll to bottom
    const logContent = document.getElementById('logContent');
    if (logContent) {
        logContent.scrollTop = logContent.scrollHeight;
    }
</script>
{% endblock %}
